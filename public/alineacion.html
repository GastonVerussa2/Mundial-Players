
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armá tu 11 - Mundial Players</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body data-pagina="alineacion">

    <div id="encabezado"></div>

    <main>
        <section class="seccion-alineacion">
            <h2>Armá tu 11 ideal</h2>

            <p>
                Elegí tus jugadores favoritos y formá tu equipo ideal.
            </p>

            <div class="controles-alineacion">
                <label for="formacion">Elegí una formación:</label>

                <select id="formacion">
                    <option value="4-3-3">4-3-3</option>
                    <option value="4-4-2">4-4-2</option>
                    <option value="3-5-2">3-5-2</option>
                </select>
            </div>

            <div id="cancha" class="cancha">
                <!-- Acá aparecerán los jugadores -->
            </div>

           <div class="acciones-alineacion">

    <button id="limpiar-equipo">
        Limpiar equipo
    </button>

    <button id="guardar-alineacion">
        Guardar alineación
    </button>

</div>

<section class="alineaciones-guardadas">
    <h3>Mis alineaciones</h3>

    <div id="lista-alineaciones">
        <!-- Acá aparecerán las alineaciones guardadas -->
    </div>
</section>
        </section>
    </main>

    
<!-- Ventana para seleccionar jugadores -->
<div id="modal-jugadores" class="modal-jugadores">

    <div class="contenido-modal">

        <div class="encabezado-modal">
            <h3>Elegí un jugador</h3>

            <button id="cerrar-modal" type="button">
                ✕
            </button>
        </div>
<input
    type="text"
    id="buscador-pais"
    placeholder="Buscar por país..."
>
        <div id="lista-jugadores" class="lista-jugadores">
            <!-- Acá aparecerán las tarjetas de jugadores -->
        </div>

    </div>

</div>


    <script src="js/componentes.js"></script>
    <script src="js/alineacion.js"></script>

</body>
</html>
